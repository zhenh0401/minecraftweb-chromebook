<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Play minecraft 1.8 in your browser" />
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.8, 1.8.8" />
		<title>EaglercraftX 1.8</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="EaglercraftX 1.8" />
		<meta property="og:description" content="Play minecraft 1.8 in your browser" />
		<meta property="og:image" content="favicon.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<script type="text/javascript" src="classes.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					
					// Inject Realistic Google Docs Stealth Layer & Toggle Button
					setTimeout(() => {
						if (!document.getElementById('stealth-frame')) {
							const stealthDiv = document.createElement('div');
							stealthDiv.id = 'stealth-frame';
							stealthDiv.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f8f9fa; z-index:2147483646; display:none; flex-direction:column; font-family:Roboto,Arial,sans-serif; overflow:hidden;';
							
							stealthDiv.innerHTML = `
								<!-- Google Docs Header -->
								<div style="background:#f9fbfd; padding:8px 16px; border-bottom:1px solid #dadce0; display:flex; align-items:center; justify-content:space-between; height:60px; box-sizing:border-box;">
									<div style="display:flex; align-items:center; gap:12px;">
										<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M22.5 3H9C7.35 3 6 4.35 6 6V30C6 31.65 7.35 33 9 33H27C28.65 33 30 31.65 30 30V10.5L22.5 3Z" fill="#2684FC"/><path d="M22.5 3V10.5H30L22.5 3Z" fill="#0066DA"/><path d="M12 18H24V20.25H12V18ZM12 22.5H24V24.75H12V22.5ZM12 13.5H18V15.75H12V13.5Z" fill="white"/></svg>
										<div>
											<div style="display:flex; align-items:center; gap:8px;">
												<span style="font-size:18px; color:#1f1f1f; font-weight:400;">English Essay Notes</span>
												<span style="font-size:12px; color:#5f6368; cursor:pointer;">📁</span>
												<span style="font-size:12px; color:#5f6368; cursor:pointer;">☁️</span>
											</div>
											<div style="display:flex; gap:12px; font-size:13px; color:#444746; margin-top:2px;">
												<span style="cursor:pointer;">File</span>
												<span style="cursor:pointer;">Edit</span>
												<span style="cursor:pointer;">View</span>
												<span style="cursor:pointer;">Insert</span>
												<span style="cursor:pointer;">Format</span>
												<span style="cursor:pointer;">Tools</span>
												<span style="cursor:pointer;">Extensions</span>
												<span style="cursor:pointer;">Help</span>
											</div>
										</div>
									</div>
									<div style="display:flex; align-items:center; gap:16px;">
										<button style="background:#c2e7ff; color:#001d35; border:none; border-radius:100px; padding:9px 24px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:8px;">🔒 Share</button>
										<div style="width:32px; height:32px; border-radius:50%; background:#0b57d0; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px;">Z</div>
									</div>
								</div>

								<!-- Google Docs Toolbar -->
								<div style="background:#edf2fa; margin:4px 12px; padding:4px 12px; border-radius:20px; display:flex; align-items:center; gap:12px; font-size:13px; color:#444746; height:36px; box-sizing:border-box;">
									<span style="cursor:pointer;">↩</span>
									<span style="cursor:pointer;">↪</span>
									<span style="cursor:pointer;">🖨️</span>
									<span style="border-left:1px solid #c7c7c7; height:16px;"></span>
									<span style="cursor:pointer;">100% ▼</span>
									<span style="border-left:1px solid #c7c7c7; height:16px;"></span>
									<span style="cursor:pointer;">Normal text ▼</span>
									<span style="border-left:1px solid #c7c7c7; height:16px;"></span>
									<span style="cursor:pointer;">Arial ▼</span>
									<span style="border-left:1px solid #c7c7c7; height:16px;"></span>
									<span style="cursor:pointer; font-weight:bold;">B</span>
									<span style="cursor:pointer; font-style:italic;">I</span>
									<span style="cursor:pointer; text-decoration:underline;">U</span>
									<span style="cursor:pointer; color:#1a73e8; font-weight:bold;">A</span>
								</div>

								<!-- Document Canvas Area -->
								<div style="flex:1; overflow-y:auto; background:#f8f9fa; display:flex; justify-content:center; padding:20px 0;">
									<iframe src="https://docs.google.com/document/d/1Se4jV7FeuBXryN-gkrEs154-BjFm5otB1YQsCQEV7Z8/preview" style="width:816px; min-height:1056px; height:calc(100vh - 140px); border:none; background:white; box-shadow:0 1px 3px rgba(60,64,67,0.15);"></iframe>
								</div>
							`;
							
							document.body.appendChild(stealthDiv);
						}

						if (!document.getElementById('stealth-btn')) {
							const btn = document.createElement('button');
							btn.id = 'stealth-btn';
							btn.innerText = 'Stealth';
							btn.style.cssText = 'position:fixed; bottom:20px; right:20px; z-index:2147483647; background:#ff4444; color:white; border:2px solid white; border-radius:8px; padding:15px 25px; font-size:18px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.8);';
							btn.onclick = () => {
								const f = document.getElementById('stealth-frame');
								f.style.display = f.style.display === 'none' ? 'flex' : 'none';
							};
							document.body.appendChild(btn);
						}
					}, 1000);
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
	</body>
</html>
